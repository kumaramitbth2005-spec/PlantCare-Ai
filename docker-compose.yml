version: '3.8'

services:
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  ai_service:
    build: ./ai_service
    ports:
      - "5000:5000"
    volumes:
      - ./ai_service/models:/app/models
    environment:
      - MODEL_PATH=/app/models/plantcare_mobilenetv2.h5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
      - ai_service
    environment:
      - PORT=8000
      - DATABASE=mongodb://mongodb:27017/plantcare
      - AI_SERVICE_URL=http://ai_service:5000/predict
      - JWT_SECRET=super-secret-key-plantcare-2024
      - JWT_EXPIRES_IN=90d

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api

volumes:
  mongodb_data:
